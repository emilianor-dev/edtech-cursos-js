<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Cursos y Colegiaturas</title>
  </head>
  <body>
    <main>
      <h1>Gestión de Cursos y Colegiaturas</h1>

      <section>
        <h2>Datos del alumno y beca</h2>
        <label for="input-alumno">Alumno:</label>
        <input type="text" id="input-alumno" value="Sofía Martínez" />

        <label for="input-beca">Beca (%):</label>
        <input type="number" id="input-beca" value="50" />

        <button type="button" id="btn-aplicar-beca">Aplicar beca</button>
        <button type="button" id="btn-reiniciar-tira">Nuevo alumno / Reiniciar tira</button>
        <p id="mensaje-estado"></p>
      </section>

      <section>
        <h2>Catálogo de cursos</h2>
        <div id="catalogo-cursos"></div>
      </section>

      <section>
        <h2>Tira de materias</h2>
        <table border="1">
          <thead>
            <tr>
              <th>Clave</th>
              <th>Curso</th>
              <th>Colegiatura</th>
            </tr>
          </thead>
          <tbody id="tira-materias"></tbody>
        </table>
      </section>

      <section>
        <h2>Total mensual</h2>
        <div id="total-mensual">$0.00</div>
      </section>

      <section>
        <h2>Pruebas de bordes</h2>
        <div id="pruebas-bordes"></div>
      </section>
    </main>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
